packages:
  - 'packages/*'
  - 'projects/*/packages/*'
  - 'projects/*'
  - 'projects/*/examples/*'
  - 'examples/*'
overrides:
  'mem-fs': '4.1.4'
  'mem-fs-editor': '12.0.4'
  'yeoman-environment@3>mem-fs': '2.3.0'
  'yeoman-environment@3>mem-fs-editor': '9.7.0'
  vue: '3.5.34'
  # These two legacy type packages declare loose @types/vscode ranges
  # (^1.48.0 and >=1.52.0 <2.0.0). A fresh resolution picks 1.138.0, which then
  # coexists with the workspace's 1.75.0 and makes app-studio-toolkit-types load
  # two @types/vscode copies, failing its compile with TS6200. Pin them to the
  # version the rest of the workspace already uses.
  '@sap-devx/code-snippet-types>@types/vscode': '1.75.0'
  '@sap/artifact-management-base-types>@types/vscode': '1.75.0'
allowBuilds:
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  bufferutil: true
  core-js: true
  ejs: true
  es5-ext: true
  esbuild: true
  keytar: true
  utf-8-validate: true
  yorkie: false
